<style>
:root{
  --primary:#64B5E8; --primary-deep:#3E8FC4; --primary-soft:#E3F2FC;
  --bg:#F4FAFD; --card:#FFFFFF; --ink:#183B56; --muted:#6B8299; --border:#E2EEF6;
  --danger:#E5484D; --danger-soft:#FDECEC; --success:#2FB67C; --success-soft:#E4F6EE;
  --warning:#F08A24; --warning-soft:#FDF1E4;
  --shadow:0 8px 22px rgba(24,59,86,.06);
  --map-bg:#EAF5FC; --map-line:#CFE5F3; --map-text:#6B8299; --halo:#FFFFFF;
  --input:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1F2E; --card:#15293C; --ink:#E6F2FA; --muted:#8FA9BF; --border:#233F57;
    --primary-soft:#183852; --danger-soft:#3A1F25; --success-soft:#15382C; --warning-soft:#3A2A18;
    --shadow:none; --map-bg:#11283A; --map-line:#1F3D56; --map-text:#8FA9BF; --halo:#11283A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1F2E; --card:#15293C; --ink:#E6F2FA; --muted:#8FA9BF; --border:#233F57;
  --primary-soft:#183852; --danger-soft:#3A1F25; --success-soft:#15382C; --warning-soft:#3A2A18;
  --shadow:none; --map-bg:#11283A; --map-line:#1F3D56; --map-text:#8FA9BF; --halo:#11283A;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Tajawal','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:inherit; }
.app{ max-width:520px; margin:0 auto; padding:14px 18px 120px; }
.ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }
.muted{ color:var(--muted); }
.small{ font-size:13px; }
.xs{ font-size:12px; }
h1{ font-size:27px; font-weight:800; margin:0; line-height:1.25; }
h2{ font-size:17px; font-weight:800; margin:0; }
.stack>*+*{ margin-top:12px; }
.row{ display:flex; align-items:center; gap:12px; }
.grow{ flex:1; min-width:0; }
.between{ justify-content:space-between; }
.section-title{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:22px; padding:18px; box-shadow:var(--shadow); }
.card.tap{ cursor:pointer; }
.card.tap:active{ transform:scale(.99); }
.card.alert{ border-color:rgba(229,72,77,.45); }
.card.selected{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
.hero{ background:linear-gradient(225deg,#183B56 0%,#24577F 100%); color:#fff; border:none; border-radius:24px; padding:20px; }
.hero .sub{ color:rgba(255,255,255,.72); font-size:13px; }
.ibox{ width:46px; height:46px; border-radius:15px; display:grid; place-items:center; flex:none; background:var(--primary-soft); color:var(--primary-deep); }
.ibox svg{ width:23px; height:23px; }
.ibox.danger{ background:var(--danger-soft); color:var(--danger); }
.ibox.success{ background:var(--success-soft); color:var(--success); }
.ibox.muted{ background:var(--border); color:var(--muted); }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12.5px; font-weight:700; white-space:nowrap; }
.chip::before{ content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
.chip.nodot::before{ display:none; }
.chip.success{ background:var(--success-soft); color:var(--success); }
.chip.danger{ background:var(--danger-soft); color:var(--danger); }
.chip.muted{ background:var(--border); color:var(--muted); }
.chip.primary{ background:var(--primary-soft); color:var(--primary-deep); }
.chip.warning{ background:var(--warning-soft); color:var(--warning); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:14px; padding:12px 18px; min-height:48px; font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; background:var(--primary); color:#fff; }
.btn svg{ width:19px; height:19px; }
.btn.block{ width:100%; }
.btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--border); }
.btn.soft{ background:var(--primary-soft); color:var(--primary-deep); }
.btn.danger{ background:var(--danger); }
.btn.danger-ghost{ background:transparent; color:var(--danger); border:1px solid var(--border); }
.btn.sm{ min-height:40px; padding:8px 14px; font-size:14px; border-radius:12px; }
.btn:disabled{ opacity:.55; cursor:default; }
.btn:focus-visible,.navbtn:focus-visible,.switch:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card.tap:focus-visible{ outline:3px solid rgba(100,181,232,.55); outline-offset:2px; }
.iconbtn{ width:42px; height:42px; border-radius:13px; border:1px solid var(--border); background:var(--card); display:grid; place-items:center; cursor:pointer; color:var(--ink); }
.iconbtn svg{ width:20px; height:20px; }
.linkbtn{ background:none; border:none; color:var(--primary-deep); font-weight:700; cursor:pointer; padding:6px 4px; }
label.f{ display:block; }
label.f>span{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500; }
input.in,select.in,textarea.in{ width:100%; border:1px solid var(--border); background:var(--card); border-radius:14px; padding:12px 14px; min-height:48px; outline:none; }
input.in:focus,select.in:focus,textarea.in:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(100,181,232,.2); }
textarea.in{ min-height:76px; resize:vertical; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.seg{ display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:5px; background:var(--card); border:1px solid var(--border); border-radius:16px; }
.seg button{ border:none; background:transparent; border-radius:12px; min-height:44px; font-weight:700; cursor:pointer; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--primary); color:#fff; }
.switch{ width:52px; height:30px; border-radius:999px; border:none; background:var(--border); position:relative; cursor:pointer; flex:none; transition:background .2s; }
.switch::after{ content:""; position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:right .2s; }
.switch[aria-checked="true"]{ background:var(--success); }
.switch[aria-checked="true"]::after{ right:25px; }
.banner{ border-radius:14px; padding:11px 14px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; }
.banner svg{ width:18px; height:18px; flex:none; margin-top:2px; }
.banner.warn{ background:var(--warning-soft); color:var(--warning); }
.banner.info{ background:var(--primary-soft); color:var(--primary-deep); }
.banner.err{ background:var(--danger-soft); color:var(--danger); }
.logo{ display:flex; align-items:center; gap:10px; }
.logo .mark{ width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,#64B5E8,#3E8FC4); display:grid; place-items:center; color:#fff; }
.logo .mark svg{ width:24px; height:24px; }
.logo b{ display:block; font-size:20px; font-weight:800; line-height:1.1; }
.logo i{ display:block; font-style:normal; font-size:10px; letter-spacing:3px; font-weight:700; color:var(--primary-deep); }
.logo.big .mark{ width:68px; height:68px; border-radius:22px; }
.logo.big .mark svg{ width:38px; height:38px; }
.logo.big b{ font-size:32px; }
.logo.big i{ font-size:13px; }
.stat{ padding:16px; }
.stat .v{ font-size:26px; font-weight:800; line-height:1.1; margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat .ibox{ width:40px; height:40px; border-radius:13px; }
.stat .ibox svg{ width:20px; height:20px; }
.avatar{ width:44px; height:44px; border-radius:50%; background:var(--primary-soft); color:var(--ink); font-weight:800; display:grid; place-items:center; position:relative; flex:none; font-size:17px; }
.avatar.alert{ background:var(--danger-soft); color:var(--danger); }
.avatar .dot{ position:absolute; bottom:-1px; left:-1px; width:13px; height:13px; border-radius:50%; border:2px solid var(--card); background:var(--muted); }
.avatar .dot.on{ background:var(--success); }
.info{ display:flex; gap:12px; align-items:center; padding:7px 0; }
.info .k{ font-size:12px; color:var(--muted); }
.info .v{ font-weight:700; }
.info .ic{ width:34px; height:34px; border-radius:11px; background:var(--primary-soft); color:var(--primary-deep); display:grid; place-items:center; flex:none; }
.info .ic svg{ width:17px; height:17px; }
.sos-wrap{ display:grid; place-items:center; margin:30px 0 8px; }
.sos{ position:relative; width:158px; height:158px; border-radius:50%; border:none; cursor:pointer; color:#fff;
  background:radial-gradient(circle at 50% 30%,#FF7C80 0%,#E5484D 62%,#C8363B 100%);
  box-shadow:0 14px 32px rgba(229,72,77,.38), inset 0 -6px 14px rgba(0,0,0,.12); }
.sos b{ display:block; font-size:38px; font-weight:900; letter-spacing:2px; line-height:1; }
.sos span{ display:block; font-size:16px; font-weight:700; margin-top:4px; }
.sos::before,.sos::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(229,72,77,.5); animation:ring 2.2s ease-out infinite; pointer-events:none; }
.sos::after{ animation-delay:1.1s; }
@keyframes ring{ from{ transform:scale(1); opacity:1; } to{ transform:scale(1.45); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .sos::before,.sos::after{ animation:none; opacity:0; } }
.idcard{ border-radius:26px; padding:20px; color:#fff; background:linear-gradient(225deg,#183B56 0%,#2A6A98 100%); position:relative; overflow:hidden; }
.idcard::after{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; left:-70px; bottom:-110px; border:36px solid rgba(100,181,232,.14); }
.idcard .lbl{ color:rgba(255,255,255,.62); font-size:12px; }
.idcard .val{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.idcard .big{ width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:24px; font-weight:800; }
.code{ font-size:34px; font-weight:900; letter-spacing:8px; text-align:center; padding:14px; border-radius:16px; background:var(--primary-soft); }
.mapbox{ border-radius:22px; overflow:hidden; border:1px solid var(--border); background:var(--map-bg); position:relative; }
.mapbox svg{ display:block; width:100%; height:auto; }
.m-bg{ fill:var(--map-bg); } .m-line{ stroke:var(--map-line); fill:none; } .m-txt{ fill:var(--map-text); font-family:inherit; }
.m-lbl{ fill:var(--ink); font-weight:700; paint-order:stroke; stroke:var(--halo); stroke-linejoin:round; }
.m-pt{ cursor:pointer; }
.lmap{ aspect-ratio:1/1; }
.lmap .leaflet-container{ width:100%; height:100%; font-family:inherit; background:var(--map-bg); }
.leaflet-tooltip.rq-tip{ font-family:'Tajawal',system-ui,sans-serif; font-weight:700; font-size:12.5px; background:var(--card); color:var(--ink); border:1px solid var(--border); border-radius:9px; padding:2px 8px; box-shadow:0 4px 12px rgba(24,59,86,.12); }
.leaflet-tooltip.rq-tip::before{ display:none; }
.rq-ring{ display:block; width:44px; height:44px; border-radius:50%; border:3px solid #E5484D; animation:ring 1.6s ease-out infinite; }
.mapfit{ position:absolute; z-index:500; bottom:12px; left:12px; }
.maphint{ position:absolute; bottom:8px; right:10px; left:10px; font-size:11.5px; color:var(--map-text); text-align:center; pointer-events:none; }
.legend{ display:flex; gap:8px; flex-wrap:wrap; }
.nav{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; }
.nav .in{ max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.navbtn{ background:none; border:none; padding:9px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; position:relative; }
.navbtn .pill{ width:56px; height:30px; border-radius:999px; display:grid; place-items:center; }
.navbtn svg{ width:22px; height:22px; }
.navbtn[aria-current="page"]{ color:var(--ink); }
.navbtn[aria-current="page"] .pill{ background:var(--primary-soft); color:var(--primary-deep); }
.badge{ position:absolute; top:4px; left:calc(50% - 26px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--danger); color:#fff; font-size:11px; display:grid; place-items:center; }
.overlay{ position:fixed; inset:0; background:rgba(14,31,46,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; padding:0; }
.overlay[hidden]{ display:none; }
.sheet{ background:var(--bg); width:100%; max-width:520px; max-height:92vh; overflow:auto; border-radius:28px 28px 0 0; padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out; }
.sheet.center{ border-radius:26px; margin:auto 16px; text-align:center; max-width:420px; }
.overlay.mid{ align-items:center; }
@keyframes up{ from{ transform:translateY(24px); opacity:.4; } to{ transform:none; opacity:1; } }
.handle{ width:44px; height:5px; border-radius:9px; background:var(--border); margin:0 auto 14px; }
.bigicon{ width:74px; height:74px; border-radius:50%; display:grid; place-items:center; margin:6px auto 12px; }
.bigicon svg{ width:38px; height:38px; }
.bigicon.danger{ background:var(--danger-soft); color:var(--danger); }
.bigicon.success{ background:var(--success-soft); color:var(--success); }
.bigicon.warning{ background:var(--warning-soft); color:var(--warning); }
.toast{ position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#183B56; color:#fff; padding:11px 18px; border-radius:14px; font-size:14px; z-index:60; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.2); }
.toast[hidden]{ display:none; }
.spin{ width:22px; height:22px; border-radius:50%; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; animation:sp .8s linear infinite; }
.spin.dark{ border-color:var(--border); border-top-color:var(--primary); }
@keyframes sp{ to{ transform:rotate(360deg); } }
.center-screen{ min-height:70vh; display:grid; place-items:center; text-align:center; }
.tag{ font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; background:var(--border); color:var(--muted); margin-inline-start:6px; }
hr.sep{ border:none; border-top:1px solid var(--border); margin:14px 0; }
</style>

let watchId = null, hbTimer = null, lastPushed = null, pushing = false, wakeLock = null;

    S.fix = { lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy || 0), t:Date.now() };
    S.geoErr = null; push(false); scheduleRender();

    if (err && err.code === 1){

async function push(force){

    const moved = distM(lastPushed, S.fix), elapsed = now - lastPushed.at;
    if (force ? elapsed < 5000 : (moved < MOVE_M && elapsed < HEARTBEAT_MS)) return;
  }
  pushing = true;

    await db.doc('members/' + S.user.uid).update({ lat:f.lat, lng:f.lng, acc:f.acc || null, locAt:f.t, updatedAt:now, sharing:true });

function mapSVG(pts, opts){
  opts = opts || {};
  if (!pts.length) return `<div class="mapbox" style="aspect-ratio:1/1;display:grid;place-items:center;text-align:center;padding:24px"><div><div class="ibox" style="margin:0 auto 10px">${I('map')}</div><b>${esc(opts.empty || 'لا توجد مواقع بعد')}</b></div></div>`;
  const c = opts.center || { lat:pts.reduce((s, p) => s + p.lat, 0) / pts.length, lng:pts.reduce((s, p) => s + p.lng, 0) / pts.length };
  const kx = 111320 * Math.cos(c.lat * Math.PI / 180), ky = 110540;
  const Q = pts.map(p => Object.assign({}, p, { x:(p.lng - c.lng) * kx, y:-(p.lat - c.lat) * ky }));
  let R = Math.max(90, ...Q.map(p => Math.max(Math.abs(p.x), Math.abs(p.y)) + (p.acc || 0))) * 1.3;
  const ring = [25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000, 50000, 100000].find(s => s >= R / 3.2) || 100000;
  const fs = R / 13, pr = R / 26, dist = m => m < 1000 ? `${m} م` : `${m / 1000} كم`;
  let g = `<rect class="m-bg" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}"/>`;
  for (let r = ring; r < R * 1.42; r += ring){
    g += `<circle class="m-line" cx="0" cy="0" r="${r}" vector-effect="non-scaling-stroke" stroke-width="1.2" stroke-dasharray="4 5"/>`;
    if (r < R) g += `<text class="m-txt" x="${r * .707}" y="${-r * .707}" font-size="${fs * .72}">${dist(r)}</text>`;
  }
  for (const p of Q){
    const act = p.act ? ` data-act="${p.act}" data-id="${esc(p.id)}" role="button" tabindex="0"` : '';
    g += `<g class="${p.act ? 'm-pt' : ''}"${act}><circle cx="${p.x}" cy="${p.y}" r="${pr}" fill="${p.color}" stroke="#fff" vector-effect="non-scaling-stroke" stroke-width="2.5"/>`;
    if (p.label) g += `<text class="m-lbl" x="${p.x}" y="${p.y + pr * 2.9}" font-size="${fs * .78}" text-anchor="middle" stroke-width="${fs * .22}">${esc(p.label)}</text>`;
    g += `</g>`;
  }
  return `<div class="mapbox"><svg viewBox="${-R} ${-R} ${2*R} ${2*R}" role="img" aria-label="خريطة المواقع">${g}</svg></div>`;
}

}

  if (S.geoErr === 'insecure') return `<div class="banner err">${I('lock')}<div>تحديد الموقع يحتاج رابطًا آمنًا يبدأ بـ <b class="ltr">https://</b>. افتح التطبيق من رابطه المنشور.</div></div>`;
  if (S.geoErr === 'unsupported') return `<div class="banner err">${I('alert')}<div>هذا المتصفح لا يدعم تحديد الموقع. جرّب Safari أو Chrome.</div></div>`;
  if (S.geoErr === 'denied') return `<div class="banner err" style="display:block">
      <div style="font-weight:800;margin-bottom:6px">لم يُسمح بالوصول لموقعك</div>
      <div style="margin-bottom:4px"><b>آيفون / آيباد:</b> الإعدادات ← الخصوصية والأمان ← خدمات الموقع ← مواقع Safari الإلكترونية ← «أثناء الاستخدام». ثم في Safari: زر إعدادات الصفحة بجانب الرابط ← إعدادات موقع الويب ← الموقع ← سماح.</div>
      <div style="margin-bottom:8px"><b>أندرويد (Chrome):</b> اضغط رمز القفل بجانب الرابط ← الأذونات ← الموقع ← سماح.</div>
      <button class="btn danger sm" data-act="retryGeo">${I('refresh')}إعادة المحاولة</button></div>`;
  if (S.geoErr === 'unavailable') return `<div class="banner warn">${I('alert')}<div>إشارة GPS ضعيفة حاليًا. اقترب من مكان مفتوح وسيستمر المحاولة تلقائيًا.</div></div>`;
  return '';
}

    body = `<h2 style="font-size:21px">نسيت كلمة المرور</h2>

function confirmBox(title, body, act, label, danger, extra){
  openModal(`<h2 style="font-size:20px">${esc(title)}</h2><p class="muted" style="margin:8px 0 18px">${esc(body)}</p>
    <div class="grid2"><button class="btn ghost" data-act="close">إلغاء</button><button class="btn${danger ? ' danger' : ''}" data-act="${act}"${extra || ''}>${esc(label)}</button></div>`, { center:true });

/* ---------------- render ---------------- */
const T_TABS = [['home', 'الرئيسية', 'home'], ['loc', 'موقعي', 'pin'], ['id', 'هويتي', 'id'], ['health', 'الصحي', 'heart']];
const S_TABS = [['dash', 'الرئيسية', 'grid'], ['map', 'الخريطة', 'map'], ['alerts', 'التنبيهات', 'bell'], ['group', 'المجموعات', 'users']];
const splash = () => center(`${logo(true)}<div style="margin-top:24px;display:grid;place-items:center">${spinner(true)}</div>`);
function render(){
  renderPending = false;
  const v = $('#view'), nav = $('#nav');
  let html = null;
  if (!auth) html = vSetup();
  else if (!S.authReady) html = splash();
  else if (!S.user) html = vAuth();
  else if (!S.meLoaded) html = splash();
  else if (!S.me) html = vCompleteProfile();
  if (html !== null){ v.innerHTML = html; nav.innerHTML = ''; return; }
  const trav = S.me.role !== 'supervisor';
  const tabs = trav ? T_TABS : S_TABS;
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  const views = trav ? { home:vTHome, loc:vTLoc, id:vTId, health:vTHealth } : { dash:vSDash, map:vSMap, alerts:vSAlerts, group:vSGroup };
  const y = window.scrollY;
  v.innerHTML = views[S.tab]();
  try{ mountMap(); }catch(e){ console.warn('map', e); }
  window.scrollTo(0, y);
  const openCount = trav ? 0 : S.alerts.filter(a => a.status === 'open').length;
  nav.innerHTML = `<div class="in">${tabs.map(t => `<button class="navbtn" data-act="tab" data-v="${t[0]}"${S.tab === t[0] ? ' aria-current="page"' : ''}><span class="pill">${I(t[2])}</span>${t[1]}${t[0] === 'alerts' && openCount ? `<span class="badge">${openCount}</span>` : ''}</button>`).join('')}</div>`;
}

/* ---------------- actions ---------------- */
function busy(k, on){ S.busy[k] = on; render(); }
function goTab(t){ S.tab = t; S.draft = {}; render(); window.scrollTo(0, 0); }
function copyText(t, msg){
  const done = () => toast(msg);
  const fallback = () => { try{ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }catch(e){ toast(t); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
async function uniqueCode(){
  for (let i = 0; i < 8; i++){ const c = genCode(); const d = await db.doc('codes/' + c).get(); if (!d.exists) return c; }
  throw new Error('code');
}
function memberData(){
  return { name:(S.draft.name || '').trim(), phone:normPhone(S.draft.phone), role:S.draft.role || 'traveler', groupId:null,
    age:'', nationality:'', bloodType:'', allergies:'', diseases:'', emergencyContact:'', sharing:true, createdAt:Date.now() };
}

const A = {
  close: closeModal,
  fitMap: () => fitMap(),
  tab: d => goTab(d.v),
  role: d => { S.draft.role = d.v; render(); },
  authMode: d => { S.authMode = d.v; render(); },
  gotoAlerts: () => { closeModal(); S.alertFilter = 'open'; goTab('alerts'); },
  afilter: d => { S.alertFilter = d.v; render(); },

  /* auth */
  async login(){
    const email = (S.draft.email || '').trim(), pw = S.draft.pw || '';
    if (!email || !pw) return toast('اكتب البريد وكلمة المرور.');
    busy('auth', true);
    try{ await auth.signInWithEmailAndPassword(email, pw); S.draft = {}; }
    catch(e){ toast(authMsg(e)); }
    busy('auth', false);
  },
  async register(){
    const m = memberData(), email = (S.draft.email || '').trim(), pw = S.draft.pw || '';
    if (m.name.length < 2) return toast('اكتب اسمك.');
    if (m.phone.length < 8) return toast('اكتب رقم جوال صحيح.');
    if (!email.includes('@')) return toast('اكتب بريدًا إلكترونيًا صحيحًا.');
    if (pw.length < 6) return toast('كلمة المرور 6 أحرف على الأقل.');
    busy('auth', true);
    try{
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      await db.doc('members/' + cred.user.uid).set(m);
      S.draft = {};
    }catch(e){ toast(e && e.code && e.code.indexOf('auth/') === 0 ? authMsg(e) : 'تعذّر حفظ بيانات الحساب. أعد المحاولة.'); }
    busy('auth', false);
  },
  async reset(){
    const email = (S.draft.email || '').trim();
    if (!email.includes('@')) return toast('اكتب بريدك الإلكتروني.');
    busy('auth', true);
    try{ await auth.sendPasswordResetEmail(email); toast('أرسلنا رابط إعادة التعيين إلى بريدك.'); S.authMode = 'login'; }
    catch(e){ toast(authMsg(e)); }
    busy('auth', false);
  },
  async completeProfile(){
    const m = memberData();
    if (m.name.length < 2) return toast('اكتب اسمك.');
    if (m.phone.length < 8) return toast('اكتب رقم جوال صحيح.');
    try{ await db.doc('members/' + S.user.uid).set(m); S.draft = {}; }catch(e){ toast('تعذّر الحفظ.'); }
  },
  signOut(){ auth.signOut(); },
  logout(){ confirmBox('تسجيل الخروج', 'سيتوقف إرسال موقعك من هذا الجهاز.', 'doLogout', 'تسجيل الخروج', true); },
  async doLogout(){ closeModal(); stopTracking(false); await auth.signOut(); },

  /* traveler */
  async join(){
    const code = normCode(S.draft.code);
    if (code.length < 6) return toast('أدخل رمز المجموعة المكوّن من 6 أحرف.');
    busy('join', true);
    try{
      const c = await db.doc('codes/' + code).get();
      if (!c.exists){ toast('لا توجد مجموعة بهذا الرمز. تأكد منه مع المشرف.'); }
      else { await db.doc('members/' + S.user.uid).update({ groupId:c.data().groupId }); delete S.draft.code; toast('تم الانضمام إلى المجموعة'); }
    }catch(e){ toast('تعذّر الانضمام. تحقق من الإنترنت.'); }
    busy('join', false);
  },
  leaveGroup(){ confirmBox('مغادرة المجموعة', 'لن يتمكن المشرف من رؤية موقعك بعد المغادرة.', 'doLeave', 'مغادرة', true); },
  async doLeave(){ closeModal(); try{ await db.doc('members/' + S.user.uid).update({ groupId:null }); toast('غادرت المجموعة'); }catch(e){ toast('تعذّرت المغادرة.'); } },
  toggleTrack(){ S.tracking ? stopTracking(true) : startTracking(); },
  retryGeo(){ startTracking(); },
  async refreshLoc(){
    if (!S.tracking) startTracking();
    busy('refresh', true);
    const f = await getOnce(12000);
    if (f){ S.fix = f; await push(true); }
    busy('refresh', false);
    toast(f ? 'تم تحديث موقعك' : 'تعذّر تحديد الموقع الآن');
  },
  async saveProfile(){
    const d = S.draft, me = S.me;
    const name = (d.p_name !== undefined ? d.p_name : me.name).trim();
    if (!name) return toast('الاسم مطلوب.');
    try{
      await db.doc('members/' + S.user.uid).update({ name, age:(d.p_age !== undefined ? normPhone(d.p_age) : me.age) || '', nationality:(d.p_nat !== undefined ? d.p_nat : me.nationality || '').trim(), phone:d.p_phone !== undefined ? normPhone(d.p_phone) : me.phone });
      ['p_name', 'p_age', 'p_nat', 'p_phone'].forEach(k => delete S.draft[k]); render(); toast('تم حفظ الملف الشخصي');
    }catch(e){ toast('تعذّر الحفظ.'); }
  },
  async saveHealth(){
    const d = S.draft, me = S.me;
    try{
      await db.doc('members/' + S.user.uid).update({
        bloodType:d.h_blood !== undefined ? d.h_blood : me.bloodType || '',
        allergies:(d.h_all !== undefined ? d.h_all : me.allergies || '').trim(),
        diseases:(d.h_dis !== undefined ? d.h_dis : me.diseases || '').trim(),
        emergencyContact:d.h_em !== undefined ? normPhone(d.h_em) : me.emergencyContact || ''
      });
      ['h_blood', 'h_all', 'h_dis', 'h_em'].forEach(k => delete S.draft[k]); render(); toast('تم حفظ الملف الصحي');
    }catch(e){ toast('تعذّر الحفظ.'); }
  },
  sos(){
    if (!S.me.groupId) return toast('انضم إلى مجموعة أولًا حتى يصل البلاغ إلى المشرف.');
    openModal(`<div class="bigicon danger">${I('alert')}</div><h2 style="font-size:21px">إرسال بلاغ طوارئ؟</h2>
      <p class="muted" style="margin:8px 0 18px">سيصل موقعك الحالي ووقت البلاغ إلى مشرف المجموعة فورًا.</p>
      <div class="grid2"><button class="btn ghost" data-act="close">إلغاء</button><button class="btn danger" data-act="sosSend">إرسال البلاغ</button></div>`, { center:true });
  },
  async sosSend(){
    const m = $('#modal'); m.dataset.locked = '1';
    m.querySelector('.sheet').innerHTML = `<div style="display:grid;place-items:center;padding:24px 0">${spinner(true)}<p class="muted" style="margin:14px 0 0">جارٍ تحديد موقعك وإرسال البلاغ…</p></div>`;
    vibrate(200);
    let f = S.fix && Date.now() - S.fix.t < 60000 ? S.fix : null;
    if (!f) f = (await getOnce(10000)) || S.fix;
    const me = S.me, now = Date.now();
    const alert = { groupId:me.groupId, userId:S.user.uid, userName:me.name, userPhone:me.phone || '', lat:f ? f.lat : null, lng:f ? f.lng : null, acc:f ? (f.acc || null) : null, createdAt:now, status:'open' };
    let state = 'ok';
    try{ await withTimeout(db.collection('alerts').add(alert), 12000); }
    catch(e){ state = e && e.message === 'timeout' ? 'pending' : 'fail'; }
    delete m.dataset.locked;
    if (state === 'ok') vibrate([100, 60, 100]);
    const where = f ? `<span class="ltr">${coords(f.lat, f.lng)}</span>` : 'تعذّر تحديد الموقع، أُرسل البلاغ بدونه.';
    m.querySelector('.sheet').innerHTML = state === 'ok'
      ? `<div class="bigicon success">${I('check')}</div><h2 style="font-size:21px">وصل بلاغك إلى المشرف</h2>
         <p style="margin:8px 0">سيتواصل معك المشرف قريبًا. ابقَ في مكانك إن أمكن.</p>
         <p class="muted small" style="margin:0">وقت البلاغ: ${esc(fmtTime(now))}</p><p class="muted small" style="margin:0 0 18px">${where}</p>
         <button class="btn block" data-act="close">حسنًا</button>`
      : state === 'pending'
      ? `<div class="bigicon warning">${I('refresh')}</div><h2 style="font-size:21px">البلاغ بانتظار الاتصال</h2>
         <p style="margin:8px 0 18px">الإنترنت ضعيف. سيُرسل البلاغ تلقائيًا فور عودة الاتصال — لا تغلق هذه الصفحة. في الخطر الشديد اتصل بالطوارئ مباشرة.</p>
         <button class="btn block" data-act="close">حسنًا</button>`
      : `<div class="bigicon warning">${I('alert')}</div><h2 style="font-size:21px">تعذّر إرسال البلاغ</h2>
         <p style="margin:8px 0 18px">أعد المحاولة. في الخطر الشديد اتصل بالطوارئ مباشرة.</p>
         <div class="grid2"><button class="btn ghost" data-act="close">إغلاق</button><button class="btn danger" data-act="sosSend">إعادة الإرسال</button></div>`;
  },

  /* supervisor */
  member: d => { const m = S.members.find(x => x.id === d.id); if (m) openModal(memberSheet(m)); },
  pickGroup: d => { scope(d.id); render(); },
  async enableNotif(){ try{ const p = await Notification.requestPermission(); toast(p === 'granted' ? 'تم تفعيل إشعارات الطوارئ' : 'لم تُفعّل الإشعارات'); }catch(e){} render(); },
  copyInvite(){ const g = selGroup(); if (g) copyText(`انضم إلى مجموعة «${g.name}» في تطبيق رِفق:\n1) افتح الرابط: ${SITE_URL}\n2) أنشئ حساب «مسافر»\n3) أدخل رمز المجموعة: ${g.code}`, 'تم نسخ رسالة الدعوة — أرسلها للمسافرين'); },
  newGroup(){ openModal(groupForm(null)); },
  editGroup(){ const g = selGroup(); if (g) openModal(groupForm(g)); },
  async createGroup(){
    const name = ($('#gf_name').value || '').trim();
    if (!name) return toast('اكتب اسم المجموعة.');
    const t = $('#gf_time').value;
    const data = { name, tripTitle:$('#gf_trip').value.trim(), meetingPoint:$('#gf_meet').value.trim(), tripTime:t ? new Date(t).getTime() : null, supervisorId:S.user.uid, createdAt:Date.now() };
    closeModal();
    try{
      data.code = await uniqueCode();
      const ref = db.collection('groups').doc();
      const batch = db.batch();
      batch.set(ref, data);
      batch.set(db.doc('codes/' + data.code), { groupId:ref.id, supervisorId:S.user.uid, createdAt:Date.now() });
      await batch.commit();
      scope(ref.id); S.tab = 'group'; render(); toast(`تم إنشاء المجموعة — الرمز ${data.code}`);
    }catch(e){ console.warn(e); toast('تعذّر إنشاء المجموعة.'); }
  },
  async saveGroup(){
    const g = selGroup(); if (!g) return;
    const name = ($('#gf_name').value || '').trim();
    if (!name) return toast('اكتب اسم المجموعة.');
    const t = $('#gf_time').value;
    const patch = { name, tripTitle:$('#gf_trip').value.trim(), meetingPoint:$('#gf_meet').value.trim(), tripTime:t ? new Date(t).getTime() : null };
    closeModal();
    try{ await db.doc('groups/' + g.id).update(patch); toast('تم حفظ التعديلات'); }catch(e){ toast('تعذّر الحفظ.'); }
  },
  newCode(){ confirmBox('إنشاء رمز جديد؟', 'لن يعمل الرمز القديم بعد الآن، ويبقى الأعضاء الحاليون في المجموعة.', 'doNewCode', 'إنشاء رمز جديد'); },
  async doNewCode(){
    closeModal(); const g = selGroup(); if (!g) return;
    try{
      const c = await uniqueCode(); const batch = db.batch();
      batch.set(db.doc('codes/' + c), { groupId:g.id, supervisorId:S.user.uid, createdAt:Date.now() });
      if (g.code) batch.delete(db.doc('codes/' + g.code));
      batch.update(db.doc('groups/' + g.id), { code:c });
      await batch.commit(); toast(`الرمز الجديد: ${c}`);
    }catch(e){ toast('تعذّر تغيير الرمز.'); }
  },
  removeMember(d){ const m = S.members.find(x => x.id === d.id); if (!m) return; confirmBox('إزالة العضو', `إزالة ${m.name} من المجموعة؟ لن تتمكن من متابعة موقعه بعد ذلك.`, 'doRemove', 'إزالة', true, ` data-id="${esc(m.id)}"`); },
  async doRemove(d){ closeModal(); try{ await db.doc('members/' + d.id).update({ groupId:null }); toast('تمت إزالة العضو'); }catch(e){ toast('تعذّرت الإزالة.'); } },
  async resolve(d){ try{ await db.doc('alerts/' + d.id).update({ status:'resolved', resolvedAt:Date.now(), resolvedBy:S.user.uid }); toast('تم تعليم البلاغ كمُعالَج'); }catch(e){ toast('تعذّر التحديث.'); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'A') return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest && e.target.closest('[data-act][tabindex]'); if (!el || el.tagName === 'BUTTON') return;
  e.preventDefault(); el.click();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset) return;
  const k = e.target.dataset.draft;
  if (k === 'code') A.join();
  else if (k === 'pw') (S.authMode === 'register' ? A.register : A.login)();
});

/* ---------------- boot ---------------- */
render();
if (auth){
  auth.onAuthStateChanged(u => {
    const prev = S.user && S.user.uid;
    if (!u){ const had = !!S.user; resetSession(); S.user = null; S.authReady = true; if (had) S.authMode = 'login'; render(); return; }
    S.user = u; S.authReady = true;
    if (u.uid !== prev){ resetSession(); bindMe(u.uid); }
    render();
  });
}
})();

</script>
</body>
</html>
