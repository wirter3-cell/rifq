<style>
/* ================= RIFQ Design Tokens ================= */
:root{
  --primary:#64B5E8; --primary-600:#3E8FC4; --primary-700:#2A6F9F; --primary-50:#EEF7FD; --primary-100:#DDEFFB;
  --bg:#F4FAFD; --card:#FFFFFF; --ink:#183B56; --ink-2:#46627A; --muted:#7690A6; --line:#E3EEF5; --field:#F8FBFE;
  --danger:#E5484D; --danger-50:#FDEEEE; --success:#1F9D68; --success-50:#E5F6EE; --warning:#D9771A; --warning-50:#FDF3E6;
  --shadow:0 1px 2px rgba(24,59,86,.04), 0 10px 28px rgba(24,59,86,.06);
  --map-bg:#EAF5FC; --map-line:#CFE5F3; --map-text:#7690A6; --halo:#FFFFFF;
  --hero-a:#183B56; --hero-b:#265F8A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1C29; --card:#132737; --ink:#E7F2FA; --ink-2:#B8CCDC; --muted:#8AA3B8; --line:#21405A; --field:#0F2231;
    --primary-50:#122F46; --primary-100:#17405F; --primary-700:#9FD3F4;
    --danger-50:#3A1E24; --success-50:#123829; --warning-50:#3A2A17;
    --shadow:none; --map-bg:#10263A; --map-line:#1E3C56; --map-text:#8AA3B8; --halo:#10263A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1C29; --card:#132737; --ink:#E7F2FA; --ink-2:#B8CCDC; --muted:#8AA3B8; --line:#21405A; --field:#0F2231;
  --primary-50:#122F46; --primary-100:#17405F; --primary-700:#9FD3F4;
  --danger-50:#3A1E24; --success-50:#123829; --warning-50:#3A2A17;
  --shadow:none; --map-bg:#10263A; --map-line:#1E3C56; --map-text:#8AA3B8; --halo:#10263A;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Geeza Pro',system-ui,sans-serif; font-size:16px; line-height:1.6;
  -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:inherit; }
.app{ max-width:560px; margin:0 auto; padding:14px 18px 128px; }
.app.bare{ padding-bottom:40px; }
.ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }
.muted{ color:var(--muted); } .ink2{ color:var(--ink-2); }
.sm{ font-size:14px; } .xs{ font-size:12.5px; }
h1,.h1{ font-size:26px; font-weight:700; margin:0; line-height:1.3; letter-spacing:-.2px; }
h2,.h2{ font-size:18px; font-weight:700; margin:0; line-height:1.4; }
h3{ font-size:16px; font-weight:600; margin:0; }
p{ margin:0; }
.stack>*+*{ margin-top:12px; } .stack.lg>*+*{ margin-top:18px; } .stack.sm>*+*{ margin-top:8px; }
.row{ display:flex; align-items:center; gap:12px; } .row.top{ align-items:flex-start; }
.grow{ flex:1; min-width:0; } .between{ justify-content:space-between; } .wrap{ flex-wrap:wrap; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.center{ text-align:center; }
.section-title{ display:flex; align-items:center; justify-content:space-between; margin:26px 2px 10px; }
.section-title h2{ font-size:16px; color:var(--ink-2); font-weight:600; }

/* cards */
.card{ background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:var(--shadow); }
.card.tap{ cursor:pointer; transition:transform .12s; } .card.tap:active{ transform:scale(.99); }
.card.flat{ box-shadow:none; }
.card.alert{ border-color:rgba(229,72,77,.5); }
.card.sel{ border-color:var(--primary); box-shadow:0 0 0 1.5px var(--primary); }
.hero{ background:linear-gradient(225deg,var(--hero-a) 0%,var(--hero-b) 100%); color:#fff; border:none; }
.hero .sub{ color:rgba(255,255,255,.72); }
.list{ padding:4px 18px; } .list>.li{ padding:14px 0; } .list>.li+.li{ border-top:1px solid var(--line); }

/* icon badges */
.ib{ width:44px; height:44px; border-radius:14px; display:grid; place-items:center; flex:none; background:var(--primary-50); color:var(--primary-600); }
.ib svg{ width:22px; height:22px; } .ib.sm{ width:36px; height:36px; border-radius:11px; } .ib.sm svg{ width:18px; height:18px; }
.ib.danger{ background:var(--danger-50); color:var(--danger); } .ib.success{ background:var(--success-50); color:var(--success); }
.ib.warning{ background:var(--warning-50); color:var(--warning); } .ib.muted{ background:var(--line); color:var(--muted); }

/* status chip */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; line-height:1.6; }
.chip.dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.chip.success{ background:var(--success-50); color:var(--success); } .chip.danger{ background:var(--danger-50); color:var(--danger); }
.chip.muted{ background:var(--line); color:var(--muted); } .chip.primary{ background:var(--primary-50); color:var(--primary-600); }
.chip.warning{ background:var(--warning-50); color:var(--warning); }
.tags{ display:flex; flex-wrap:wrap; gap:6px; }
.tag{ padding:4px 11px; border-radius:10px; background:var(--primary-50); color:var(--ink); font-size:14px; font-weight:500; }
.tag.red{ background:var(--danger-50); color:var(--danger); }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; border-radius:16px; padding:12px 20px; min-height:54px; font-weight:600; font-size:16px; cursor:pointer; text-decoration:none; background:var(--primary-600); color:#fff; transition:filter .15s, transform .1s; }
.btn:active{ transform:scale(.985); } .btn svg{ width:20px; height:20px; }
.btn.block{ width:100%; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.soft{ background:var(--primary-50); color:var(--primary-600); }
.btn.danger{ background:var(--danger); } .btn.danger-soft{ background:var(--danger-50); color:var(--danger); }
.btn.sm{ min-height:42px; padding:8px 14px; font-size:14.5px; border-radius:13px; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn:focus-visible,.navbtn:focus-visible,.switch:focus-visible,.pill:focus-visible,.role:focus-visible,.in:focus-visible,.card.tap:focus-visible,.linkbtn:focus-visible{ outline:3px solid rgba(100,181,232,.55); outline-offset:2px; }
.iconbtn{ width:44px; height:44px; border-radius:14px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; cursor:pointer; color:var(--ink); flex:none; text-decoration:none; }
.iconbtn svg{ width:21px; height:21px; }
.linkbtn{ background:none; border:none; color:var(--primary-600); font-weight:600; cursor:pointer; padding:8px 4px; font-size:15px; }
.action{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px; border-radius:18px; background:var(--card); border:1px solid var(--line); text-decoration:none; font-weight:600; font-size:14px; cursor:pointer; color:var(--ink); }
.action .ib{ width:42px; height:42px; }
.action.disabled{ opacity:.45; pointer-events:none; }

/* fields */
.field{ display:block; } .field>span{ display:block; font-size:14px; color:var(--ink-2); margin:0 2px 7px; font-weight:500; }
.field>small{ display:block; color:var(--muted); font-size:12.5px; margin:6px 2px 0; }
.in{ width:100%; border:1.5px solid var(--line); background:var(--field); border-radius:15px; padding:13px 15px; min-height:54px; outline:none; font-size:16px; transition:border-color .15s, box-shadow .15s; }
.in:focus{ border-color:var(--primary); box-shadow:0 0 0 4px rgba(100,181,232,.18); background:var(--card); }
textarea.in{ min-height:84px; resize:vertical; line-height:1.6; }
.in.code{ text-align:center; font-size:26px; font-weight:700; letter-spacing:8px; text-transform:uppercase; }

/* choice pills */
.pills{ display:flex; flex-wrap:wrap; gap:8px; }
.pill{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:9px 16px; min-height:44px; font-weight:500; font-size:15px; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
.pill[aria-pressed="true"]{ background:var(--primary-100); border-color:var(--primary); color:var(--primary-700); font-weight:600; }
.pill[aria-pressed="true"]::before{ content:"✓"; font-weight:700; }
.pill.blood{ min-width:64px; justify-content:center; direction:ltr; font-weight:700; font-size:16px; }
.pill.blood[aria-pressed="true"]{ background:var(--danger-50); border-color:var(--danger); color:var(--danger); }
.pill.blood[aria-pressed="true"]::before{ content:none; }

/* role cards */
.role{ display:flex; align-items:center; gap:14px; width:100%; text-align:start; border:1.5px solid var(--line); background:var(--card); border-radius:20px; padding:16px; cursor:pointer; }
.role b{ display:block; font-size:16.5px; } .role small{ display:block; color:var(--muted); font-size:13.5px; line-height:1.5; margin-top:2px; }
.role .tick{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:none; }
.role[aria-pressed="true"]{ border-color:var(--primary); background:var(--primary-50); }
.role[aria-pressed="true"] .tick{ border:7px solid var(--primary-600); }

/* switch */
.switch{ width:56px; height:32px; border-radius:999px; border:none; background:var(--line); position:relative; cursor:pointer; flex:none; transition:background .2s; }
.switch::after{ content:""; position:absolute; top:3px; right:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:right .2s; }
.switch[aria-checked="true"]{ background:var(--success); } .switch[aria-checked="true"]::after{ right:27px; }

/* banners */
.banner{ border-radius:16px; padding:12px 14px; font-size:14.5px; display:flex; gap:10px; align-items:flex-start; line-height:1.6; }
.banner svg{ width:19px; height:19px; flex:none; margin-top:3px; }
.banner.warn{ background:var(--warning-50); color:var(--warning); } .banner.info{ background:var(--primary-50); color:var(--primary-600); }
.banner.err{ background:var(--danger-50); color:var(--danger); }

/* brand */
.brand{ display:flex; align-items:center; gap:10px; }
.brand svg{ width:40px; height:40px; flex:none; }
.brand b{ display:block; font-size:21px; font-weight:700; line-height:1.1; }
.brand i{ display:block; font-style:normal; font-size:10.5px; letter-spacing:3.5px; font-weight:600; color:var(--primary-600); margin-top:2px; }
.brand.xl{ flex-direction:column; gap:12px; text-align:center; } .brand.xl svg{ width:76px; height:76px; }
.brand.xl b{ font-size:34px; } .brand.xl i{ font-size:12.5px; letter-spacing:5px; }

/* stepper */
.steps{ display:flex; gap:6px; } .steps span{ flex:1; height:6px; border-radius:6px; background:var(--line); }
.steps span.on{ background:var(--primary); }

/* stats */
.stat{ padding:14px; text-align:center; } .stat .v{ font-size:28px; font-weight:700; line-height:1.2; } .stat .k{ color:var(--muted); font-size:13px; }

/* avatar */
.avatar{ width:46px; height:46px; border-radius:50%; background:var(--primary-100); color:var(--primary-700); font-weight:700; display:grid; place-items:center; position:relative; flex:none; font-size:18px; }
.avatar.alert{ background:var(--danger-50); color:var(--danger); }
.avatar .dot{ position:absolute; bottom:0; left:0; width:13px; height:13px; border-radius:50%; border:2.5px solid var(--card); background:var(--muted); }
.avatar .dot.on{ background:var(--success); }

/* kv */
.kv{ display:flex; justify-content:space-between; gap:12px; padding:11px 0; }
.kv+.kv{ border-top:1px solid var(--line); }
.kv .k{ color:var(--muted); font-size:14.5px; flex:none; } .kv .v{ font-weight:600; text-align:left; min-width:0; overflow-wrap:anywhere; }
.kv .v.empty{ color:var(--muted); font-weight:400; }

/* completion ring */
.ring{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center; flex:none; background:conic-gradient(var(--primary-600) calc(var(--p)*1%), var(--line) 0); }
.ring span{ width:46px; height:46px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-weight:700; font-size:14px; }

/* status hero */
.status{ display:flex; align-items:center; gap:14px; }
.status .big{ width:56px; height:56px; border-radius:18px; display:grid; place-items:center; flex:none; }
.status .big svg{ width:28px; height:28px; }
.pulse{ position:relative; } .pulse::after{ content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--success); animation:ring 2s ease-out infinite; }

/* SOS */
.sos-wrap{ display:grid; place-items:center; margin:26px 0 6px; }
.sos{ position:relative; width:172px; height:172px; border-radius:50%; border:none; cursor:pointer; color:#fff;
  background:radial-gradient(circle at 50% 30%,#FF8185 0%,#E5484D 60%,#C5343A 100%);
  box-shadow:0 16px 36px rgba(229,72,77,.38), inset 0 -6px 14px rgba(0,0,0,.12); }
.sos b{ display:block; font-size:42px; font-weight:700; letter-spacing:2px; line-height:1; font-family:system-ui,sans-serif; }
.sos span{ display:block; font-size:17px; font-weight:600; margin-top:6px; }
.sos::before,.sos::after{ content:""; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(229,72,77,.5); animation:ring 2.2s ease-out infinite; pointer-events:none; }
.sos::after{ animation-delay:1.1s; }
@keyframes ring{ from{ transform:scale(1); opacity:1; } to{ transform:scale(1.42); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .sos::before,.sos::after,.pulse::after{ animation:none; opacity:0; } }

/* digital card */
.idcard{ border-radius:24px; padding:20px; color:#fff; background:linear-gradient(225deg,#183B56 0%,#2A6A98 100%); position:relative; overflow:hidden; box-shadow:0 14px 34px rgba(24,59,86,.25); }
.idcard::after{ content:""; position:absolute; width:240px; height:240px; border-radius:50%; left:-80px; bottom:-130px; border:40px solid rgba(100,181,232,.14); }
.idcard .lbl{ color:rgba(255,255,255,.62); font-size:12.5px; } .idcard .val{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.idcard .blood{ background:#fff; color:#C5343A; border-radius:14px; padding:6px 12px; font-weight:700; font-size:20px; direction:ltr; text-align:center; min-width:60px; }
.idcard .in-row{ position:relative; z-index:1; }

/* medical card */
.med{ border-radius:20px; padding:16px; background:var(--danger-50); }
.med .bt{ width:64px; height:64px; border-radius:18px; background:var(--card); color:var(--danger); display:grid; place-items:center; font-weight:700; font-size:22px; direction:ltr; flex:none; }
.med .k{ color:var(--danger); font-size:13px; font-weight:600; margin-bottom:4px; }

/* code */
.code{ font-size:34px; font-weight:700; letter-spacing:8px; text-align:center; padding:14px; border-radius:18px; background:var(--primary-50); color:var(--primary-700); direction:ltr; font-family:ui-monospace,Menlo,monospace; }

/* map */
.mapbox{ border-radius:22px; overflow:hidden; border:1px solid var(--line); background:var(--map-bg); position:relative; }
.mapbox svg{ display:block; width:100%; height:auto; }
.lmap{ aspect-ratio:1/1; } .lmap .leaflet-container{ width:100%; height:100%; font-family:inherit; background:var(--map-bg); }
.m-bg{ fill:var(--map-bg); } .m-line{ stroke:var(--map-line); fill:none; } .m-txt{ fill:var(--map-text); font-family:inherit; }
.m-lbl{ fill:var(--ink); font-weight:700; paint-order:stroke; stroke:var(--halo); stroke-linejoin:round; } .m-pt{ cursor:pointer; }
.leaflet-tooltip.rq-tip{ font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; font-weight:600; font-size:13px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:2px 9px; box-shadow:0 4px 12px rgba(24,59,86,.12); }
.leaflet-tooltip.rq-tip::before{ display:none; }
.rq-ring{ display:block; width:44px; height:44px; border-radius:50%; border:3px solid #E5484D; animation:ring 1.6s ease-out infinite; }
.mapfit{ position:absolute; z-index:500; bottom:12px; left:12px; }

/* nav */
.nav{ position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; }
.nav .in-nav{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(var(--n),1fr); }
.navbtn{ background:none; border:none; padding:9px 4px 11px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; position:relative; }
.navbtn .p{ width:60px; height:32px; border-radius:999px; display:grid; place-items:center; } .navbtn svg{ width:23px; height:23px; }
.navbtn[aria-current="page"]{ color:var(--ink); } .navbtn[aria-current="page"] .p{ background:var(--primary-100); color:var(--primary-700); }
.badge{ position:absolute; top:5px; left:calc(50% - 28px); min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:var(--danger); color:#fff; font-size:11.5px; display:grid; place-items:center; }

/* sheets */
.overlay{ position:fixed; inset:0; background:rgba(13,28,41,.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.overlay[hidden]{ display:none; } .overlay.mid{ align-items:center; }
.sheet{ background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:28px 28px 0 0; padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out; }
.sheet.center{ border-radius:28px; margin:auto 16px; text-align:center; max-width:420px; padding:22px 20px; }
@keyframes up{ from{ transform:translateY(24px); opacity:.4; } to{ transform:none; opacity:1; } }
.handle{ width:44px; height:5px; border-radius:9px; background:var(--line); margin:0 auto 14px; }
.bigicon{ width:76px; height:76px; border-radius:50%; display:grid; place-items:center; margin:4px auto 12px; }
.bigicon svg{ width:38px; height:38px; }
.bigicon.danger{ background:var(--danger-50); color:var(--danger); } .bigicon.success{ background:var(--success-50); color:var(--success); } .bigicon.warning{ background:var(--warning-50); color:var(--warning); }
.toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#183B56; color:#fff; padding:12px 18px; border-radius:15px; font-size:15px; z-index:60; max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.2); text-align:center; }
.toast[hidden]{ display:none; }
.spin{ width:22px; height:22px; border-radius:50%; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; animation:sp .8s linear infinite; }
.spin.dark{ border-color:var(--line); border-top-color:var(--primary-600); }
@keyframes sp{ to{ transform:rotate(360deg); } }
.center-screen{ min-height:70vh; display:grid; place-items:center; text-align:center; }
.qrbox{ background:#fff; border-radius:22px; padding:14px; max-width:300px; margin:18px auto 14px; box-shadow:var(--shadow); }
.qrbox svg{ width:100%; height:auto; display:block; }
.qrcam{ border-radius:20px; overflow:hidden; background:#0B1620; min-height:260px; margin:14px 0 10px; }

const I = (n, st) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${st ? ` style="${st}"` : ''}><path d="${P[n]}"/></svg>`;

/* ---------------- formatting ---------------- */
const NF = 'ar-u-nu-latn';
const fmtTime = t => new Intl.DateTimeFormat(NF, { hour:'numeric', minute:'2-digit' }).format(t);
const fmtDT = t => t ? new Intl.DateTimeFormat(NF, { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }).format(t) : '—';
function ago(t){
  if (!t) return 'غير متوفر';
  const s = (Date.now() - t) / 1000;
  if (s < 45) return 'الآن';
  if (s < 3600) return `قبل ${Math.max(1, Math.round(s / 60))} دقيقة`;
  if (s < 86400) return `قبل ${Math.round(s / 3600)} ساعة`;
  return fmtDT(t);
}
function tripStatus(t){
  const d = t - Date.now();
  if (d < 0) return d > -3 * 3600e3 ? 'جارية الآن' : 'انتهت';
  if (d < 3600e3) return `بعد ${Math.max(1, Math.round(d / 60e3))} دقيقة`;
  if (d < 86400e3) return `بعد ${Math.round(d / 3600e3)} ساعة`;
  return `بعد ${Math.round(d / 86400e3)} يوم`;
}
const coords = (a, b) => `${a.toFixed(5)}, ${b.toFixed(5)}`;
const gmaps = (a, b) => `https://www.google.com/maps/search/?api=1&query=${a},${b}`;
const first = n => String(n || '').trim().split(/\s+/)[0] || '';
const initial = n => (String(n || '').trim()[0] || '؟');
function normPhone(s){
  const ar = '٠١٢٣٤٥٦٧٨٩';
  return String(s || '').split('').map(c => { const i = ar.indexOf(c); return i >= 0 ? String(i) : c; }).join('').replace(/[^\d+]/g, '');
}
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function genKey(){ const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let c = ''; for (let i = 0; i < 16; i++) c += a[Math.floor(Math.random() * a.length)]; return c; }
function genCode(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 6; i++) c += a[Math.floor(Math.random() * a.length)]; return c; }
const hasLoc = m => typeof m.lat === 'number' && typeof m.lng === 'number';
const isOnline = m => !!m && m.sharing !== false && !!m.updatedAt && Date.now() - m.updatedAt < ONLINE_MS;
function toLocalInput(ms){ if (!ms) return ''; const d = new Date(ms); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function distM(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const splitList = s => String(s || '').split(/[،,]/).map(x => x.trim()).filter(Boolean);

/* ---------------- Firebase ---------------- */
const cfg = window.RIFQ_FIREBASE_CONFIG || {};
let auth = null, db = null, initError = null;
if (cfg.apiKey && cfg.projectId){
  if (!window.firebase) initError = 'تعذّر تحميل مكتبات Firebase. تحقق من الإنترنت ثم أعد تحميل الصفحة.';
  else {
    try{ if (!firebase.apps.length) firebase.initializeApp(cfg); auth = firebase.auth(); db = firebase.firestore(); }
    catch(e){ initError = 'إعدادات Firebase غير صحيحة: ' + (e.message || e); }
  }
}
const docData = d => Object.assign({ id:d.id }, d.data());
function watch(ref, cb, isQuery){
  let un = null, dead = false, tries = 0;
  const start = () => {
    un = ref.onSnapshot(s => cb(isQuery ? s.docs.map(docData) : (s.exists ? docData(s) : null)), e => {
      console.warn('watch', e && e.code);
      if (!dead && tries++ < 5) setTimeout(() => { if (!dead) start(); }, 1500 * tries);
    });
  };
  start();
  return () => { dead = true; if (un) un(); };
}
const watchDoc = (path, cb) => watch(db.doc(path), cb, false);
const watchQuery = (col, field, value, cb) => watch(db.collection(col).where(field, '==', value), cb, true);
function authMsg(e){
  const c = e && e.code;
  return ({
    'auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة.',
    'auth/user-not-found':'البريد أو كلمة المرور غير صحيحة.',
    'auth/wrong-password':'البريد أو كلمة المرور غير صحيحة.',
    'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.',
    'auth/invalid-login-credentials':'البريد أو كلمة المرور غير صحيحة.',
    'auth/email-already-in-use':'هذا البريد مسجّل مسبقًا. سجّل الدخول بدلًا من ذلك.',
    'auth/weak-password':'كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل.',
    'auth/network-request-failed':'لا يوجد اتصال بالإنترنت.',
    'auth/too-many-requests':'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.',
    'auth/operation-not-allowed':'تسجيل الدخول بالبريد غير مفعّل في Firebase.',
    'auth/configuration-not-found':'تسجيل الدخول غير مفعّل في Firebase (Authentication).',
    'auth/unauthorized-domain':'هذا الرابط غير مضاف في Firebase ← Authorized domains.'
  })[c] || ('تعذّر إكمال العملية' + (c ? ` (${c})` : '.'));
}

/* ---------------- state ---------------- */
const S = {
  user:null, authReady:false, me:null, meLoaded:false, tab:null,
  group:null, groups:[], groupsLoaded:false, selGroupId:LS.get('rifq_sel_group', null), scopeId:undefined,
  members:[], alerts:[], seen:null,
  fix:null, geoErr:null, tracking:false, trackTried:false, wake:false,
  draft:{}, authMode:'login', alertFilter:'open', busy:{}, wiz:null, editing:null, trails:{}
};
const subs = {};
function unsub(k){ if (subs[k]){ try{ subs[k](); }catch(e){} subs[k] = null; } }
function unsubAll(){ Object.keys(subs).forEach(unsub); }
const val = (k, fb) => (S.draft[k] !== undefined ? S.draft[k] : (fb == null ? '' : fb));

/* ---------------- render scheduling ---------------- */
let renderTimer = null, renderPending = false;
function isEditing(){ const a = document.activeElement; return !!(a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function scheduleRender(){ if (isEditing()){ renderPending = true; return; } clearTimeout(renderTimer); renderTimer = setTimeout(render, 16); }
document.addEventListener('focusout', () => {
  if (!renderPending) return;
  setTimeout(() => { if (isEditing()) return; if (renderPending){ renderPending = false; render(); } }, 350);
});
function onField(e){
  const t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.draft) S.draft[t.dataset.draft] = t.value;
  if (t.dataset.w && S.wiz) S.wiz[t.dataset.w] = t.value;
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
setInterval(scheduleRender, 30000);

/* ---------------- toast & modal ---------------- */
let toastTimer = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600); }
function openModal(html, opts){
  const m = $('#modal');
  m.className = 'overlay' + (opts && opts.center ? ' mid' : '');
  m.innerHTML = `<div class="sheet${opts && opts.center ? ' center' : ''}" role="dialog" aria-modal="true">${opts && opts.center ? '' : '<div class="handle"></div>'}${html}</div>`;
  m.hidden = false;
}
function setSheet(html){ const s = $('#modal .sheet'); if (!s) return; const y = s.scrollTop; s.innerHTML = '<div class="handle"></div>' + html; s.scrollTop = y; }
function closeModal(){ stopScanner(); const m = $('#modal'); m.hidden = true; m.innerHTML = ''; S.editing = null; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#modal').dataset.locked) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden && !$('#modal').dataset.locked) closeModal(); });
function beep(){
  try{
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C(); [0, .28, .56].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = .0001; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + d; g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
      o.start(t); o.stop(t + .24);
    });
  }catch(e){}
}
const vibrate = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ---------------- session ---------------- */
function resetSession(){
  stopTracking(false); unsubAll();
  Object.assign(S, { me:null, meLoaded:false, tab:null, group:null, groups:[], groupsLoaded:false, members:[], alerts:[], scopeId:undefined, seen:null, fix:null, geoErr:null, trackTried:false, draft:{}, wiz:null, editing:null });
}
function bindMe(uid){
  unsub('me');
  subs.me = watchDoc('members/' + uid, d => {
    const prev = S.me; S.me = d; S.meLoaded = true;
    if (d) onMe(prev, d);
    scheduleRender();
  });
}
function onMe(prev, me){
  if (me.role === 'traveler'){
    if (!prev || prev.groupId !== me.groupId){
      unsub('group'); S.group = null;
      if (me.groupId) subs.group = watchDoc('groups/' + me.groupId, g => { S.group = g; scheduleRender(); });
    }
    if (!me.onboarded && me.groupId && prev && !prev.groupId){ S.wiz = null; S.tab = 'home'; meRef().update({ onboarded:true }).catch(() => {}); toast('أضافك المشرف إلى المجموعة 🎉'); }
    if (me.onboarded && !S.trackTried){ S.trackTried = true; if (me.sharing !== false) startTracking(); }
  } else if (!subs.groups){
    subs.groups = watchQuery('groups', 'supervisorId', me.id, list => {
      S.groups = list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); S.groupsLoaded = true;
      const keep = S.selGroupId && list.some(g => g.id === S.selGroupId);
      scope(keep ? S.selGroupId : (list[0] ? list[0].id : null));
      if (list.length && S.me && !S.me.onboarded) db.doc('members/' + S.user.uid).update({ onboarded:true }).catch(() => {});
      scheduleRender();
    });
  }
}
function scope(id){
  S.selGroupId = id; LS.set('rifq_sel_group', id);
  if (id === S.scopeId) return;
  S.scopeId = id; LM.key = null; S.trails = {}; unsub('members'); unsub('alerts'); S.members = []; S.alerts = []; S.seen = null;
  if (!id) return;
  subs.members = watchQuery('members', 'groupId', id, l => { trackTrails(l); S.members = l.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar')); scheduleRender(); });
  subs.alerts = watchQuery('alerts', 'groupId', id, l => { l.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); incoming(l); S.alerts = l; scheduleRender(); });
}
function trackTrails(list){
  for (const m of list){
    if (!hasLoc(m)) continue;
    const t = S.trails[m.id] || (S.trails[m.id] = []), last = t[t.length - 1];
    if (!last || last[0] !== m.lat || last[1] !== m.lng){ t.push([m.lat, m.lng]); if (t.length > 40) t.shift(); }
  }
}
const selGroup = () => S.groups.find(g => g.id === S.selGroupId) || null;

function incoming(list){
  if (!S.seen){ S.seen = new Set(list.map(a => a.id)); return; }
  const fresh = list.filter(a => !S.seen.has(a.id));
  fresh.forEach(a => S.seen.add(a.id));
  const hit = fresh.find(a => a.status === 'open' && (a.createdAt || 0) > Date.now() - 10 * 60e3);
  if (!hit) return;
  vibrate([300, 120, 300, 120, 300]); beep();
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('🚨 بلاغ طوارئ — رِفق', { body:`${hit.userName} يحتاج مساعدة`, tag:hit.id, requireInteraction:true }); }catch(e){}
  }
  openModal(`<div class="bigicon danger">${I('alert')}</div>
    <h2 style="font-size:22px">بلاغ طوارئ جديد</h2>
    <p style="margin:8px 0 4px"><b>${esc(hit.userName)}</b> يطلب المساعدة — ${esc(ago(hit.createdAt))}</p>
    <p class="muted sm" style="margin:0 0 18px">${hit.lat != null ? 'الموقع مرفق مع البلاغ.' : 'لم يُرفق موقع مع البلاغ.'}</p>
    <div class="grid2"><button class="btn ghost" data-act="close">لاحقًا</button><button class="btn danger" data-act="gotoAlerts">عرض البلاغ</button></div>`, { center:true });
}

/* ---------------- tracking ---------------- */
let watchId = null, hbTimer = null, lastPushed = null, pushing = false, wakeLock = null;
function startTracking(){
  S.geoErr = null;
  if (!window.isSecureContext){ S.geoErr = 'insecure'; S.tracking = false; scheduleRender(); return; }
  if (!('geolocation' in navigator)){ S.geoErr = 'unsupported'; S.tracking = false; scheduleRender(); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  S.tracking = true;
  watchId = navigator.geolocation.watchPosition(p => {
    S.fix = { lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy || 0), t:Date.now() };
    S.geoErr = null; push(false); scheduleRender();
  }, err => {
    if (err && err.code === 1){
      S.geoErr = 'denied'; S.tracking = false;
      if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null;
      clearInterval(hbTimer); releaseWake();
    } else S.geoErr = 'unavailable';
    scheduleRender();
  }, { enableHighAccuracy:true, maximumAge:10000, timeout:30000 });
  clearInterval(hbTimer); hbTimer = setInterval(() => push(false), 10000);
  requestWake();
  if (S.me && S.me.sharing === false) db.doc('members/' + S.user.uid).update({ sharing:true }).catch(() => {});
  scheduleRender();
}
function stopTracking(persist){
  if (watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
  watchId = null; clearInterval(hbTimer); releaseWake();
  const was = S.tracking; S.tracking = false; lastPushed = null;
  if (persist && was && S.user) db.doc('members/' + S.user.uid).update({ sharing:false, updatedAt:Date.now() }).catch(() => {});
  scheduleRender();
}
async function push(force){
  if (!S.fix || !S.user || !S.tracking || pushing) return;
  const now = Date.now();
  if (lastPushed){
    const moved = distM(lastPushed, S.fix), elapsed = now - lastPushed.at;
    if (force ? elapsed < 4000 : (elapsed < MIN_PUSH_MS || (moved < MOVE_M && elapsed < HEARTBEAT_MS))) return;
  }
  pushing = true; const f = S.fix;
  try{ await db.doc('members/' + S.user.uid).update({ lat:f.lat, lng:f.lng, acc:f.acc || null, locAt:f.t, updatedAt:now, sharing:true }); lastPushed = { lat:f.lat, lng:f.lng, at:now }; }
  catch(e){ console.warn('push', e && e.code); }

}
function getOnce(ms){
  return new Promise(res => {
    if (!navigator.geolocation || !window.isSecureContext) return res(null);
    try{ navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy || 0), t:Date.now() }), () => res(null), { enableHighAccuracy:true, timeout:ms, maximumAge:15000 }); }
    catch(e){ res(null); }

}
async function requestWake(){

    wakeLock = await navigator.wakeLock.request('screen'); S.wake = true;
    wakeLock.addEventListener('release', () => { wakeLock = null; S.wake = false; scheduleRender(); });
    scheduleRender();

}

/* ---------------- maps ---------------- */
function mapSVG(pts, opts){
  opts = opts || {};
  if (!pts.length) return `<div class="mapbox" style="aspect-ratio:1/1;display:grid;place-items:center;text-align:center;padding:24px"><div><div class="ib" style="margin:0 auto 10px">${I('map')}</div><b>${esc(opts.empty || 'لا توجد مواقع بعد')}</b></div></div>`;
  const c = { lat:pts.reduce((s, p) => s + p.lat, 0) / pts.length, lng:pts.reduce((s, p) => s + p.lng, 0) / pts.length };
  const kx = 111320 * Math.cos(c.lat * Math.PI / 180), ky = 110540;
  const Q = pts.map(p => Object.assign({}, p, { x:(p.lng - c.lng) * kx, y:-(p.lat - c.lat) * ky }));
  const R = Math.max(90, ...Q.map(p => Math.max(Math.abs(p.x), Math.abs(p.y)))) * 1.3, fs = R / 13, pr = R / 26;
  let g = `<rect class="m-bg" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}"/>`;
  for (const p of Q) g += `<g${p.act ? ` class="m-pt" data-act="${p.act}" data-id="${esc(p.id)}"` : ''}><circle cx="${p.x}" cy="${p.y}" r="${pr}" fill="${p.color}" stroke="#fff" vector-effect="non-scaling-stroke" stroke-width="2.5"/>${p.label ? `<text class="m-lbl" x="${p.x}" y="${p.y + pr * 2.9}" font-size="${fs * .78}" text-anchor="middle" stroke-width="${fs * .22}">${esc(p.label)}</text>` : ''}</g>`;
  return `<div class="mapbox"><svg viewBox="${-R} ${-R} ${2*R} ${2*R}" role="img" aria-label="خريطة المواقع">${g}</svg></div>`;
}
const LM = { el:null, map:null, layer:null, key:null, pts:[], req:null };
function liveMap(pts, opts){
  if (!pts.length || !window.L) return mapSVG(pts, opts);
  LM.req = { pts, opts:opts || {} };
  return `<div class="mapbox lmap" id="map-slot"><button class="btn sm mapfit" data-act="fitMap" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">${I('target')}عرض الكل</button></div>`;
}
function fitMap(){
  const m = LM.map, pts = LM.pts; if (!m || !pts.length) return;
  if (pts.length === 1) m.setView([pts[0].lat, pts[0].lng], 17);
  else m.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])), { padding:[48, 48], maxZoom:17 });
}
function mountMap(){
  const slot = document.getElementById('map-slot');
  if (!slot || !LM.req || !window.L) return;
  const { pts, opts } = LM.req; LM.req = null;
  if (!LM.el){ LM.el = document.createElement('div'); LM.el.style.cssText = 'position:absolute;inset:0'; }
  slot.appendChild(LM.el);
  if (!LM.map){
    LM.map = L.map(LM.el, { zoomControl:true }).setView([HARAM.lat, HARAM.lng], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19, subdomains:'abcd', attribution:'&copy; OpenStreetMap &copy; CARTO' }).addTo(LM.map);
    LM.layer = L.layerGroup().addTo(LM.map);
  }
  LM.map.invalidateSize(); LM.layer.clearLayers(); LM.pts = pts;
  for (const p of pts) if (p.trail && p.trail.length > 1) L.polyline(p.trail, { color:p.color, weight:4, opacity:.55, dashArray:'1 9', lineCap:'round' }).addTo(LM.layer);
  for (const p of pts.slice().sort((a, b) => (a.z || 0) - (b.z || 0))){
    if (p.acc) L.circle([p.lat, p.lng], { radius:p.acc, color:'#64B5E8', weight:1, fillColor:'#64B5E8', fillOpacity:.15 }).addTo(LM.layer);
    if (p.pulse) L.marker([p.lat, p.lng], { icon:L.divIcon({ className:'', html:'<span class="rq-ring"></span>', iconSize:[44, 44], iconAnchor:[22, 22] }), interactive:false }).addTo(LM.layer);
    const mk = L.circleMarker([p.lat, p.lng], { radius:10, color:'#fff', weight:3, fillColor:p.color, fillOpacity:1 }).addTo(LM.layer);
    if (p.label) mk.bindTooltip(esc(p.label), { permanent:true, direction:'top', offset:[0, -11], className:'rq-tip' });
    if (p.act) mk.on('click', () => A[p.act]({ id:p.id }));
  }
  if (opts.follow){
    if (LM.key !== opts.key){ LM.key = opts.key; LM.map.setView([pts[0].lat, pts[0].lng], 17); }
    else LM.map.panTo([pts[0].lat, pts[0].lng], { animate:true });
  } else if (LM.key !== opts.key){ LM.key = opts.key; setTimeout(fitMap, 60); }
}

function scanMsg(html){ const el = document.getElementById('scan-msg'); if (el) el.innerHTML = html; }
async function startScanner(){
  const Lib = window.__Html5QrcodeLibrary__;
  if (!Lib){ scanMsg('تعذّر تحميل الماسح. استخدم «التقاط صورة» بالأسفل.'); return; }
  try{
    scanner = new Lib.Html5Qrcode('qr-reader', { verbose:false });
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:220, height:220 } }, t => onScan(t), () => {});
    scanMsg('وجّه الكاميرا نحو الباركود…');
  }catch(e){ scanner = null; scanMsg('لم نتمكن من فتح الكاميرا. اسمح بالوصول للكاميرا، أو استخدم «التقاط صورة».'); }
}
async function stopScanner(){ const s = scanner; scanner = null; if (s){ try{ await s.stop(); }catch(e){} try{ s.clear(); }catch(e){} } }
async function onScan(text){
  if (scanBusy) return;
  const m = /^RIFQ:([A-Za-z0-9_-]+):([a-z0-9]+)$/.exec(String(text || '').trim());
  if (!m){ scanMsg('<b style="color:var(--danger)">هذا ليس باركود رِفق.</b>'); return; }
  const g = selGroup(); if (!g) return;
  scanBusy = true; await stopScanner(); scanMsg(`${spinner(true)}`);
  try{
    await db.doc('members/' + m[1]).update({ groupId:g.id, claim:m[2] });
    vibrate(80); closeModal(); toast('تمت إضافة المسافر إلى المجموعة ✓');
  }catch(e){
    scanMsg(`<b style="color:var(--danger)">${e && e.code === 'permission-denied' ? 'الباركود قديم أو غير صالح. اطلب من المسافر فتح باركوده من جديد.' : 'تعذّرت الإضافة. تحقق من الإنترنت.'}</b><br><button class="btn soft sm" style="margin-top:10px" data-act="scanQr">إعادة المسح</button>`);

}
async function scanFromFile(file){
  const Lib = window.__Html5QrcodeLibrary__; if (!Lib || !file) return;
  await stopScanner(); scanMsg(spinner(true));
  try{ const tmp = new Lib.Html5Qrcode('qr-file', { verbose:false }); const text = await tmp.scanFile(file, false); await onScan(text); }
  catch(e){ scanMsg('<b style="color:var(--danger)">لم نجد باركود واضح في الصورة. حاول مرة أخرى.</b>'); }
}

      </div>
      ${!me.groupId ? `<div class="card stack"><div class="row"><div class="ib">${I('users')}</div><div class="grow"><h2>انضم لمجموعتك</h2><p class="muted sm">أدخل الرمز من المشرف</p></div></div>
        <div class="row"><input class="in code grow" style="font-size:20px;letter-spacing:5px" maxlength="8" data-draft="code" value="${esc(val('code'))}" placeholder="ABC234" aria-label="رمز المجموعة" autocapitalize="characters"><button class="btn" data-act="join" style="flex:none">${S.busy.join ? spinner() : 'انضمام'}</button></div>
        <button class="btn soft block" data-act="showQr">${I('qr')}أو اعرض باركودي للمشرف</button></div>` : ''}
      ${trip ? `<div class="card row top"><div class="ib">${I('bus')}</div><div class="grow"><div class="row between"><p class="muted sm">الرحلة القادمة</p>${trip.tripTime ? `<span class="chip primary">${esc(tripStatus(trip.tripTime))}</span>` : ''}</div>
        <h2 style="margin-top:2px">${esc(trip.tripTitle)}</h2>${trip.tripTime ? `<p class="ink2 sm">${esc(fmtDT(trip.tripTime))}</p>` : ''}${trip.meetingPoint ? `<p class="ink2 sm">نقطة التجمع: ${esc(trip.meetingPoint)}</p>` : ''}</div></div>` : ''}
      ${pct < 100 ? `<div class="card tap row" data-act="tab" data-v="me" tabindex="0"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div class="grow"><h3>أكمل ملفك الصحي</h3><p class="muted sm">يساعد المسعفين على خدمتك بسرعة</p></div><span class="muted">${I('chev', 'width:20px;height:20px')}</span></div>` : ''}

/* ---------------- render ---------------- */
const T_TABS = [['home', 'الرئيسية', 'home'], ['loc', 'موقعي', 'pin'], ['me', 'ملفي', 'user']];
const S_TABS = [['dash', 'الرئيسية', 'grid'], ['map', 'الخريطة', 'map'], ['alerts', 'البلاغات', 'bell'], ['group', 'المجموعة', 'users']];
const splash = () => center(`${brand('xl')}<div style="margin-top:26px;display:grid;place-items:center">${spinner(true)}</div>`);
function render(){
  renderPending = false;
  const v = $('#view'), nav = $('#nav');
  let html = null, bare = true;
  if (!auth) html = vSetup();
  else if (!S.authReady) html = splash();
  else if (!S.user) html = vAuth();
  else if (!S.meLoaded) html = splash();
  else if (!S.me) html = vNoProfile();
  else if (!S.me.onboarded) html = S.me.role === 'supervisor' ? vSWizard() : vTWizard();
  if (html !== null){ v.className = 'app' + (bare ? ' bare' : ''); v.innerHTML = html; nav.innerHTML = ''; return; }
  v.className = 'app';
  const trav = S.me.role !== 'supervisor', tabs = trav ? T_TABS : S_TABS;
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  const views = trav ? { home:vTHome, loc:vTLoc, me:vTMe } : { dash:vSDash, map:vSMap, alerts:vSAlerts, group:vSGroup };
  const y = window.scrollY;
  v.innerHTML = views[S.tab]();
  try{ mountMap(); }catch(e){ console.warn('map', e); }
  window.scrollTo(0, y);
  const openCount = trav ? 0 : S.alerts.filter(a => a.status === 'open').length;
  nav.innerHTML = `<div class="in-nav" style="--n:${tabs.length}">${tabs.map(t => `<button class="navbtn" data-act="tab" data-v="${t[0]}"${S.tab === t[0] ? ' aria-current="page"' : ''}><span class="p">${I(t[2])}</span>${t[1]}${t[0] === 'alerts' && openCount ? `<span class="badge">${openCount}</span>` : ''}</button>`).join('')}</div>`;
}
function refresh(){ if (S.editing) setSheet(S.editing === 'group' ? groupSheet(!!S.editingGroup) : editSheet(S.editing)); else render(); }

/* ---------------- actions ---------------- */
function busy(k, on){ S.busy[k] = on; render(); }
function goTab(t){ S.tab = t; S.draft = {}; render(); window.scrollTo(0, 0); }
function copyText(t, msg){
  const done = () => toast(msg);
  const fallback = () => { try{ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }catch(e){ toast(t); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
async function uniqueCode(){
  for (let i = 0; i < 8; i++){ const c = genCode(); const d = await db.doc('codes/' + c).get(); if (!d.exists) return c; }
  throw new Error('code');
}
const meRef = () => db.doc('members/' + S.user.uid);
function newMember(name, role){
  return { name:name.trim(), phone:'', role, groupId:null, age:'', nationality:'', bloodType:'', allergies:'', diseases:'', medications:'',
    emergencyName:'', emergencyRelation:'', emergencyContact:'', sharing:true, onboarded:false, qrKey:genKey(), createdAt:Date.now() };
}
async function joinByCode(raw){
  const code = normCode(raw);
  if (code.length < 6){ toast('أدخل رمز المجموعة المكوّن من 6 أحرف.'); return false; }
  const c = await db.doc('codes/' + code).get();
  if (!c.exists){ toast('لا توجد مجموعة بهذا الرمز. تأكد منه مع المشرف.'); return false; }
  await meRef().update({ groupId:c.data().groupId });
  return true;
}
function groupFromWiz(){
  const w = S.wiz || {};
  return { name:(w.gname || '').trim(), tripTitle:(w.gtrip || '').trim(), meetingPoint:(w.gmeet || '').trim(), tripTime:w.gtime ? new Date(w.gtime).getTime() : null };
}

const A = {
  close: closeModal,
  fitMap: () => fitMap(),
  tab: d => goTab(d.v),
  role: d => { S.draft.role = d.v; render(); },
  authMode: d => { S.authMode = d.v; render(); },
  gotoAlerts: () => { closeModal(); S.alertFilter = 'open'; goTab('alerts'); },
  afilter: (d, el) => { S.alertFilter = el.dataset.f; render(); },

  /* auth */
  async login(){
    const email = (S.draft.email || '').trim(), pw = S.draft.pw || '';
    if (!email || !pw) return toast('اكتب البريد وكلمة المرور.');
    busy('auth', true);
    try{ await auth.signInWithEmailAndPassword(email, pw); S.draft = {}; }catch(e){ toast(authMsg(e)); }
    busy('auth', false);
  },
  async register(){
    const name = (S.draft.name || '').trim(), role = S.draft.role || 'traveler', email = (S.draft.email || '').trim(), pw = S.draft.pw || '';
    if (name.length < 2) return toast('اكتب اسمك الكامل.');
    if (!email.includes('@')) return toast('اكتب بريدًا إلكترونيًا صحيحًا.');
    if (pw.length < 6) return toast('كلمة المرور 6 أحرف على الأقل.');
    busy('auth', true);
    try{ const cred = await auth.createUserWithEmailAndPassword(email, pw); await db.doc('members/' + cred.user.uid).set(newMember(name, role)); S.draft = {}; }
    catch(e){ toast(e && e.code && e.code.indexOf('auth/') === 0 ? authMsg(e) : 'تعذّر حفظ بيانات الحساب. أعد المحاولة.'); }
    busy('auth', false);
  },
  async reset(){
    const email = (S.draft.email || '').trim();
    if (!email.includes('@')) return toast('اكتب بريدك الإلكتروني.');
    busy('auth', true);
    try{ await auth.sendPasswordResetEmail(email); toast('أرسلنا رابط إعادة التعيين إلى بريدك.'); S.authMode = 'login'; }catch(e){ toast(authMsg(e)); }
    busy('auth', false);
  },
  async completeProfile(){
    const name = (S.draft.name || '').trim();
    if (name.length < 2) return toast('اكتب اسمك الكامل.');
    try{ await meRef().set(newMember(name, S.draft.role || 'traveler')); S.draft = {}; }catch(e){ toast('تعذّر الحفظ.'); }
  },
  signOut(){ auth.signOut(); },
  logout(){ confirmBox('تسجيل الخروج', 'سيتوقف إرسال موقعك من هذا الجهاز.', 'doLogout', 'تسجيل الخروج', true); },
  async doLogout(){ closeModal(); stopTracking(false); await auth.signOut(); },

  /* wizard / edit choices */
  wBlood(d){ S.wiz.blood = S.wiz.blood === d.v ? '' : d.v; refresh(); },
  wRel(d){ S.wiz.emRel = S.wiz.emRel === d.v ? '' : d.v; refresh(); },
  wToggle(d, el){
    const set = S.wiz[el.dataset.k], v = d.v;
    if (set.has(v)) set.delete(v);
    else if (v === NONE){ set.clear(); set.add(NONE); }
    else { set.delete(NONE); set.add(v); }
    refresh();
  },
  async wNext(){
    const key = WIZ_STEPS[S.wiz.step], err = wizError(key);
    if (err) return toast(err);
    busy('wiz', true);
    try{
      if (key === 'group'){
        if (!(await joinByCode(S.wiz.code))){ busy('wiz', false); return; }
        await meRef().update({ onboarded:true }); S.wiz = null; S.tab = 'home'; toast('أهلًا بك في رِفق 🎉');
      } else { await meRef().update(wizPatch(key)); S.wiz.step++; window.scrollTo(0, 0); }
    }catch(e){ toast('تعذّر الحفظ. تحقق من الإنترنت.'); }
    busy('wiz', false);
  },
  wBack(){ S.wiz.step = Math.max(0, S.wiz.step - 1); render(); window.scrollTo(0, 0); },
  wSkip(){ S.wiz.step++; render(); window.scrollTo(0, 0); },
  async wFinish(){ try{ await meRef().update({ onboarded:true }); S.wiz = null; S.tab = 'home'; }catch(e){ toast('تعذّر الحفظ.'); } },
  async sSkip(){ try{ await meRef().update({ onboarded:true }); S.wiz = null; }catch(e){ toast('تعذّر الحفظ.'); } },
  editSection(d){ S.wiz = wizFromMe(S.me); S.editing = d.v; openModal(editSheet(d.v)); },
  async saveSection(){
    const key = S.editing, err = wizError(key);
    if (err) return toast(err);
    try{ await meRef().update(wizPatch(key)); closeModal(); S.wiz = null; toast('تم الحفظ ✓'); }catch(e){ toast('تعذّر الحفظ.'); }
  },

  /* traveler */
  async join(){
    busy('join', true);
    try{ if (await joinByCode(S.draft.code)){ delete S.draft.code; toast('تم الانضمام إلى المجموعة'); } }catch(e){ toast('تعذّر الانضمام. تحقق من الإنترنت.'); }
    busy('join', false);
  },
  leaveGroup(){ confirmBox('مغادرة المجموعة', 'لن يتمكن المشرف من رؤية موقعك بعد المغادرة.', 'doLeave', 'مغادرة', true); },
  async doLeave(){ closeModal(); try{ await meRef().update({ groupId:null }); toast('غادرت المجموعة'); }catch(e){ toast('تعذّرت المغادرة.'); } },
  toggleTrack(){ S.tracking ? stopTracking(true) : startTracking(); },
  retryGeo(){ startTracking(); },
  async refreshLoc(){
    if (!S.tracking) startTracking();
    busy('refresh', true);
    const f = await getOnce(12000);
    if (f){ S.fix = f; await push(true); }
    busy('refresh', false);
    toast(f ? 'تم تحديث موقعك' : 'تعذّر تحديد الموقع الآن');
  },
  sos(){
    if (!S.me.groupId) return toast('انضم إلى مجموعة أولًا حتى يصل البلاغ إلى المشرف.');
    openModal(`<div class="bigicon danger">${I('alert')}</div><h2 style="font-size:22px">إرسال بلاغ طوارئ؟</h2>
      <p class="muted" style="margin:8px 0 20px">سيصل موقعك الحالي وبطاقتك الطبية إلى مشرف المجموعة فورًا.</p>
      <div class="grid2"><button class="btn ghost" data-act="close">إلغاء</button><button class="btn danger" data-act="sosSend">إرسال الآن</button></div>`, { center:true });
  },
  async sosSend(){
    const m = $('#modal'); m.dataset.locked = '1';
    m.querySelector('.sheet').innerHTML = `<div style="display:grid;place-items:center;padding:26px 0">${spinner(true)}<p class="muted" style="margin-top:14px">جارٍ تحديد موقعك وإرسال البلاغ…</p></div>`;
    vibrate(200);
    let f = S.fix && Date.now() - S.fix.t < 60000 ? S.fix : null;
    if (!f) f = (await getOnce(10000)) || S.fix;
    const me = S.me, now = Date.now();
    const alert = { groupId:me.groupId, userId:S.user.uid, userName:me.name, userPhone:me.phone || '', lat:f ? f.lat : null, lng:f ? f.lng : null, acc:f ? (f.acc || null) : null, createdAt:now, status:'open' };
    let state = 'ok';
    try{ await withTimeout(db.collection('alerts').add(alert), 12000); }catch(e){ state = e && e.message === 'timeout' ? 'pending' : 'fail'; }
    delete m.dataset.locked;
    if (state === 'ok') vibrate([100, 60, 100]);
    m.querySelector('.sheet').innerHTML = state === 'ok'
      ? `<div class="bigicon success">${I('check')}</div><h2 style="font-size:22px">وصل بلاغك للمشرف</h2>
         <p style="margin:8px 0 4px">سيتواصل معك قريبًا. ابقَ في مكانك إن أمكن.</p>
         <p class="muted sm" style="margin-bottom:20px">${esc(fmtTime(now))}${f ? '' : ' — تعذّر تحديد الموقع'}</p>
         <button class="btn block" data-act="close">حسنًا</button>`
      : state === 'pending'
      ? `<div class="bigicon warning">${I('refresh')}</div><h2 style="font-size:22px">البلاغ بانتظار الاتصال</h2>
         <p style="margin:8px 0 20px">الإنترنت ضعيف. سيُرسل تلقائيًا فور عودة الاتصال — لا تغلق الصفحة. في الخطر الشديد اتصل بالطوارئ مباشرة.</p>
         <button class="btn block" data-act="close">حسنًا</button>`
      : `<div class="bigicon warning">${I('alert')}</div><h2 style="font-size:22px">تعذّر إرسال البلاغ</h2>
         <p style="margin:8px 0 20px">أعد المحاولة. في الخطر الشديد اتصل بالطوارئ مباشرة.</p>
         <div class="grid2"><button class="btn ghost" data-act="close">إغلاق</button><button class="btn danger" data-act="sosSend">إعادة الإرسال</button></div>`;
  },

  async showQr(){
    let key = S.me.qrKey;
    if (!key){ key = genKey(); try{ await meRef().update({ qrKey:key }); }catch(e){ return toast('تعذّر إنشاء الباركود.'); } }
    openModal(qrSheet(key));
  },
  async newQr(){ const key = genKey(); try{ await meRef().update({ qrKey:key }); setSheet(qrSheet(key)); toast('تم إنشاء باركود جديد، القديم لم يعد يعمل'); }catch(e){ toast('تعذّر التحديث.'); } },

  /* supervisor */
  async scanQr(){ if (!selGroup()) return toast('أنشئ مجموعة أولًا.'); await stopScanner(); openModal(scanSheet()); startScanner(); },
  member: d => { const m = S.members.find(x => x.id === d.id); if (m) openModal(memberSheet(m)); },
  pickGroup: d => { scope(d.id); render(); },
  async enableNotif(){ try{ const p = await Notification.requestPermission(); toast(p === 'granted' ? 'تم تفعيل إشعارات الطوارئ' : 'لم تُفعّل الإشعارات'); }catch(e){} render(); },
  copyInvite(){ const g = selGroup(); if (g) copyText(`انضم إلى مجموعة «${g.name}» في تطبيق رِفق:\n1) افتح الرابط: ${SITE_URL}\n2) أنشئ حساب «مسافر»\n3) أدخل رمز المجموعة: ${g.code}`, 'تم نسخ رسالة الدعوة — أرسلها للمسافرين'); },
  newGroup(){ S.wiz = { gname:'', gtrip:'', gmeet:'', gtime:'' }; S.editing = 'group'; S.editingGroup = false; openModal(groupSheet(false)); },
  editGroup(){ const g = selGroup(); if (!g) return; S.wiz = { gname:g.name || '', gtrip:g.tripTitle || '', gmeet:g.meetingPoint || '', gtime:toLocalInput(g.tripTime) }; S.editing = 'group'; S.editingGroup = true; openModal(groupSheet(true)); },
  async createGroup(){
    const data = groupFromWiz();
    if (!data.name) return toast('اكتب اسم المجموعة.');
    Object.assign(data, { supervisorId:S.user.uid, createdAt:Date.now() });
    const inWizard = !S.me.onboarded;
    if (inWizard) busy('group', true); else closeModal();
    try{
      data.code = await uniqueCode();
      const ref = db.collection('groups').doc(), batch = db.batch();
      batch.set(ref, data);
      batch.set(db.doc('codes/' + data.code), { groupId:ref.id, supervisorId:S.user.uid, createdAt:Date.now() });
      await batch.commit();
      if (inWizard) await meRef().update({ onboarded:true });
      scope(ref.id); S.wiz = null; S.tab = inWizard ? 'dash' : 'group'; toast(`تم إنشاء المجموعة — الرمز ${data.code}`);
    }catch(e){ console.warn(e); toast('تعذّر إنشاء المجموعة.'); }
    S.busy.group = false; render();
  },
  async saveGroup(){
    const g = selGroup(); if (!g) return;
    const data = groupFromWiz();
    if (!data.name) return toast('اكتب اسم المجموعة.');
    closeModal();
    try{ await db.doc('groups/' + g.id).update(data); S.wiz = null; toast('تم حفظ التعديلات'); }catch(e){ toast('تعذّر الحفظ.'); }
  },
  newCode(){ confirmBox('إنشاء رمز جديد؟', 'لن يعمل الرمز القديم بعد الآن، ويبقى الأعضاء الحاليون في المجموعة.', 'doNewCode', 'إنشاء رمز جديد'); },
  async doNewCode(){
    closeModal(); const g = selGroup(); if (!g) return;
    try{
      const c = await uniqueCode(), batch = db.batch();
      batch.set(db.doc('codes/' + c), { groupId:g.id, supervisorId:S.user.uid, createdAt:Date.now() });
      if (g.code) batch.delete(db.doc('codes/' + g.code));
      batch.update(db.doc('groups/' + g.id), { code:c });
      await batch.commit(); toast(`الرمز الجديد: ${c}`);
    }catch(e){ toast('تعذّر تغيير الرمز.'); }
  },
  removeMember(d){ const m = S.members.find(x => x.id === d.id); if (!m) return; confirmBox('إزالة العضو', `إزالة ${m.name} من المجموعة؟ لن تتمكن من متابعة موقعه بعد ذلك.`, 'doRemove', 'إزالة', true, ` data-id="${esc(m.id)}"`); },
  async doRemove(d){ closeModal(); try{ await db.doc('members/' + d.id).update({ groupId:null }); toast('تمت إزالة العضو'); }catch(e){ toast('تعذّرت الإزالة.'); } },
  async resolve(d){ try{ await db.doc('alerts/' + d.id).update({ status:'resolved', resolvedAt:Date.now(), resolvedBy:S.user.uid }); toast('تم تعليم البلاغ كمُعالَج'); }catch(e){ toast('تعذّر التحديث.'); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A'){ if (el.classList.contains('disabled')) e.preventDefault(); return; }
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest && e.target.closest('[data-act][tabindex]'); if (!el || el.tagName === 'BUTTON') return;
  e.preventDefault(); el.click();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset) return;
  const t = e.target;
  if (t.dataset.draft === 'code') A.join();
  else if (t.dataset.draft === 'pw') (S.authMode === 'register' ? A.register : A.login)();
  else if (t.dataset.w === 'code') A.wNext();
});

/* ---------------- boot ---------------- */
render();
if (auth){
  auth.onAuthStateChanged(u => {
    const prev = S.user && S.user.uid;
    if (!u){ const had = !!S.user; resetSession(); S.user = null; S.authReady = true; if (had) S.authMode = 'login'; render(); return; }
    S.user = u; S.authReady = true;
    if (u.uid !== prev){ resetSession(); bindMe(u.uid); }
    render();
  });
}
})();

</script>
</body>
</html>
